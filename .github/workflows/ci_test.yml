name: AI Quant V10 CI

# 觸發條件：推送到任何分支時
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-and-coverage:
    name: 測試與覆蓋率報告 (Test & Coverage)
    runs-on: ubuntu-latest
    
    steps:
    # 1. 檢出程式碼
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. 安裝依賴
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 執行測試並生成覆蓋率報告
    # --cov=./ : 計算當前目錄的覆蓋率
    # --cov-report=html : 生成 HTML 報告
    # --cov-report=term : 在終端機顯示摘要
    - name: Run Tests
      run: |
        pytest --cov=./ --cov-report=html:cov_html --cov-report=term tests/

    # 5. 上傳覆蓋率報告作為 Artifact
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      if: always() # 即使測試失敗也上傳報告以便除錯
      with:
        name: coverage-report
        path: cov_html/
        retention-days: 7
