version: "3.8"

services:
  # --- Supabase Core ---
  db:
    image: supabase/postgres:15.1.0.147
    container_name: supabase-db
    ports: [ "5432:5432" ]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
      - ./volumes/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  kong:
    image: kong:2.8.1
    container_name: supabase-kong
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
    volumes:
      - ./config/kong.yml:/var/lib/kong/kong.yml
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.132.3
    container_name: supabase-auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
    depends_on: [ db ]

  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: supabase-rest
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMA: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    depends_on: [ db ]

  realtime:
    image: supabase/realtime:v2.25.22
    container_name: supabase-realtime
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      PORT: 4000
    depends_on: [ db ]

  storage:
    image: supabase/storage-api:v0.40.4
    container_name: supabase-storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on: [ db, rest ]

  # --- Supabase Management ---
  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: supabase-meta
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_PORT: 8080
    depends_on: [ db ]

  studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    ports:
      - "54323:3000"
    environment:
      SUPABASE_URL: http://kong:8000
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    depends_on: [ db, kong, meta ]

  # --- Custom AI Worker ---
  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-worker
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_KEY: ${SERVICE_ROLE_KEY}
      DB_CONNECTION_STRING: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - ./backend:/app
    depends_on: [ db, kong ]
    restart: always

  # --- Frontend Application ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-frontend
    ports: [ "3000:3000" ]
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [ kong ]
