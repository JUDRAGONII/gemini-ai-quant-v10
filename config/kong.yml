_format_version: "1.1"
services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1
        strip_path: false

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1
        strip_path: true

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1
        strip_path: false

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - OPTIONS
        - PUT
        - PATCH
        - DELETE
      headers:
        - Content-Type
        - Authorization
        - apikey
        - X-Client-Info
      exposed_headers:
        - Content-Range
        - X-Total-Count
      max_age: 3600
      credentials: true
